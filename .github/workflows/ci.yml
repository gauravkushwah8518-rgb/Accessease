name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Parse and asset checks
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build the widget bundle
        run: npm run build:widget

      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --quiet -- widget-build/accessease.js; then
            echo "::error::widget-build/accessease.js is out of date. Run 'npm run build:widget' and commit the result."
            git diff --stat -- widget-build/accessease.js
            exit 1
          fi
